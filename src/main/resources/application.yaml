server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://localhost:8080
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: image-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/images/**
              filters:
                - name: JwtAuthGatewayFilter

            - id: comment-like-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/comments/**,/api/likes/**
              filters:
                - name: JwtAuthGatewayFilter

  jwt:
    secret: "mySuperSecretKeyForJWTTokenGenerationAndValidationInSpringMicroserviceCourse2023"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

---
spring:
  config:
    activate:
      on-profile: kubernetes
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true