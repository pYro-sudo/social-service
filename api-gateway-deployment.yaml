apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: social-network-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service.social-network-users:8081"
            - name: IMAGE_SERVICE_URL
              value: "http://image-service.social-network-images:8082"
            - name: COMMENT_LIKE_SERVICE_URL
              value: "http://comment-like-service.social-network-comments:8083"
            - name: ACTIVITY_SERVICE_URL
              value: "http://activity-service.social-network-activities:8085"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: social-network-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080