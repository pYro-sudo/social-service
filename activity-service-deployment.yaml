apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: social-network-activities
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: activity-service:latest
          ports:
            - containerPort: 8085
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb.social-network-db:27017/activity_db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.social-network-db:9092"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: social-network-activities
spec:
  selector:
    app: activity-service
  ports:
    - port: 8085
      targetPort: 8085